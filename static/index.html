<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVault · 登录</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236366f1' d='M6 19a5 5 0 0 1-.9-9.9A6 6 0 0 1 17 8a4.5 4.5 0 0 1 1 8.9V19z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="auth-wrap">
    <!-- 左侧品牌区 -->
    <section class="auth-hero">
      <div class="hero-brand">
        <span class="hero-logo">
          <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M6 19a5 5 0 0 1-.9-9.9A6 6 0 0 1 17 8a4.5 4.5 0 0 1 1 8.9"/><path d="M12 12v6"/><path d="m9 15 3-3 3 3"/></svg>
        </span>
        CloudVault
      </div>
      <div class="hero-title">安全、极速的<br>企业级云端存储</div>
      <p class="hero-sub">端到端加密传输、内容寻址秒传、多文件拖拽上传。为团队与个人打造的现代云盘。</p>
      <div class="hero-points">
        <div class="hero-point"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>内容寻址秒传，重复文件瞬间完成</div>
        <div class="hero-point"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>加盐哈希 + JWT 鉴权，数据安全可靠</div>
        <div class="hero-point"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>拖拽即传，实时进度，云端异步备份</div>
      </div>
    </section>

    <!-- 右侧表单区 -->
    <section class="auth-panel">
      <div class="auth-card">
        <h2 id="formTitle">欢迎回来</h2>
        <p class="muted" id="formSub">登录以访问你的云端文件</p>

        <div class="tabs">
          <div class="tab active" data-tab="login">登录</div>
          <div class="tab" data-tab="register">注册</div>
        </div>

        <form id="authForm" autocomplete="off">
          <div class="field">
            <label for="username">用户名</label>
            <input class="input" id="username" name="username" placeholder="3-32 位字母 / 数字 / _ / -" autocomplete="username">
          </div>
          <div class="field">
            <label for="password">密码</label>
            <div class="pw-wrap">
              <input class="input" id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="current-password">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="显示密码">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="pwHint" style="display:none">密码长度需 6-64 位</div>
          </div>
          <div class="field" id="confirmField" style="display:none">
            <label for="confirm">确认密码</label>
            <input class="input" id="confirm" name="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" id="submitBtn" type="submit" style="width:100%; margin-top:6px;">
            <span id="submitText">登录</span>
          </button>
        </form>

        <div style="margin-top:20px; text-align:center;">
          <button class="btn btn-ghost btn-sm theme-toggle" id="themeToggle" type="button">
            <svg class="icon" viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span id="themeLabel">深色模式</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div id="toasts"></div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
